name: Deploy — Payment API

# Target: /home/curac/public_html/payment_api/
# URL:    https://cur.ac.rw/payment_api/
# Method: cPanel UAPI over HTTPS (port 2083) — SSH/FTP blocked on this server.
#
# Standalone PHP app — no Composer dependencies, no build step.
#
# Required GitHub Secret:
#   CPANEL_PASS — cPanel account password

on:
  push:
    branches: [main]
    paths:
      - 'payment_api/**'
      - '.github/workflows/deploy-payment-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-payment-api
  cancel-in-progress: false

env:
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac

jobs:
  deploy:
    name: Deploy Payment API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          cd payment_api
          zip -r ../payment-api.zip . \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store' \
            --exclude './apitest.html' \
            --exclude './test.html' \
            --exclude './text.html' \
            --exclude './debug.php'
          cd ..
          echo "Archive size: $(du -sh payment-api.zip | cut -f1)"

      - name: Upload archive → public_html/payment_api/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          # Remove leftover zip from any previous failed run
          echo "Pre-delete: $(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" -G \
            --data-urlencode "files-0-file=/public_html/payment_api/payment-api.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files")" || true

          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/payment_api" \
            -F "overwrite=1" \
            -F "file-1=@payment-api.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload: $RESPONSE"
          [ "$(echo "$RESPONSE" | jq -r '.status // 0')" = "1" ] || { echo "Upload failed"; exit 1; }

      - name: Extract archive on server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -G \
            --data-urlencode "cpanel_jsonapi_version=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=extractfile" \
            --data-urlencode "file=/public_html/payment_api/payment-api.zip" \
            --data-urlencode "dir=/public_html/payment_api/" \
            "https://cpanel.cur.ac.rw:2083/json-api/cpanel")
          echo "Extract: $RESPONSE"
          ERROR=$(echo "$RESPONSE" | jq -r '.cpanelresult.error // ""')
          [ -z "$ERROR" ] || { echo "Extract failed: $ERROR"; exit 1; }

      - name: Delete archive from server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" -G \
            --data-urlencode "files-0-file=/public_html/payment_api/payment-api.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files" > /dev/null

      - name: Write job summary
        if: always()
        run: |
          echo "## Payment API Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`~/public_html/payment_api/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://cur.ac.rw/payment_api/ |" >> $GITHUB_STEP_SUMMARY
