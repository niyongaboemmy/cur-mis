name: Deploy — Payment API

# Target: /home/curac/public_html/payment_api/
# URL:    https://cur.ac.rw/payment_api/
# Method: rsync over SFTP (port 22) — server does not support FTP/FTPS
#
# Standalone PHP app — no Composer dependencies, no build step.
#
# Required GitHub Secrets  (repo → Settings → Secrets and variables → Actions → Secrets):
#   SFTP_PRIVATE_KEY  — private key whose public half is in server ~/.ssh/authorized_keys

on:
  push:
    branches: [main]
    paths:
      - 'payment_api/**'
      - '.github/workflows/deploy-payment-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-payment-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Payment API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SFTP_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 cur.ac.rw >> ~/.ssh/known_hosts 2>/dev/null || true

      # Deploy payment_api/ directly to public_html/payment_api/.
      # Excludes test/debug files and the accidental Windows error log on the server.
      - name: rsync payment_api/ → public_html/payment_api/
        run: |
          rsync -avz \
            --exclude='.DS_Store' \
            --exclude='__MACOSX/' \
            --exclude='apitest.html' \
            --exclude='test.html' \
            --exclude='text.html' \
            --exclude='debug.php' \
            -e "ssh -p 22" \
            payment_api/ \
            curac@cur.ac.rw:~/public_html/payment_api/

      - name: Write job summary
        if: always()
        run: |
          echo "## Payment API Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`~/public_html/payment_api/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://cur.ac.rw/payment_api/ |" >> $GITHUB_STEP_SUMMARY
