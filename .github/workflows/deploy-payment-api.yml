name: Deploy — Payment API

# Target: /home/curac/public_html/payment_api/
# URL:    https://cur.ac.rw/payment_api/
# Method: cPanel UAPI (port 2083) for upload; PHP helper for extraction.
#         cPanel has no zip-extract API — .github/scripts/extract-inplace.php handles it.
#
# Required GitHub Secret:
#   CPANEL_PASS — cPanel account password

on:
  push:
    branches: [main]
    paths:
      - 'payment_api/**'
      - '.github/workflows/deploy-payment-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-payment-api
  cancel-in-progress: false

env:
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac

jobs:
  deploy:
    name: Deploy Payment API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          cd payment_api
          zip -r ../payment-api.zip . \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store' \
            --exclude './apitest.html' \
            --exclude './test.html' \
            --exclude './text.html' \
            --exclude './debug.php'
          cd ..
          echo "Archive size: $(du -sh payment-api.zip | cut -f1)"

      - name: Upload & extract
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          TOKEN=$(openssl rand -hex 16)

          # Inject token + zip name into the PHP extractor template
          sed -e "s/DEPLOY_TOKEN/$TOKEN/" \
              -e "s/DEPLOY_ZIP_NAME/payment-api.zip/" \
              .github/scripts/extract-inplace.php > _extract.php

          # Upload zip (overwrite=1 handles stale zips from failed previous runs)
          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/payment_api" \
            -F "overwrite=1" \
            -F "file-1=@payment-api.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload zip: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Zip upload failed"; exit 1; }

          # Upload extractor script
          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/payment_api" \
            -F "overwrite=1" \
            -F "file-1=@_extract.php;type=text/plain" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload extractor: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Extractor upload failed"; exit 1; }

          # Trigger extraction — script self-destructs and deletes the zip
          RESULT=$(curl -s -k "https://cur.ac.rw/payment_api/_extract.php?token=$TOKEN")
          echo "Extract result: $RESULT"
          [ "$RESULT" = "ok" ] || { echo "Extraction failed: $RESULT"; exit 1; }

      - name: Write job summary
        if: always()
        run: |
          echo "## Payment API Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`~/public_html/payment_api/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://cur.ac.rw/payment_api/ |" >> $GITHUB_STEP_SUMMARY
