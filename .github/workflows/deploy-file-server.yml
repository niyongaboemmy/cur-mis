name: Deploy — File Server (CDN)

# Method: rsync over SFTP (port 22) — server does not support FTP/FTPS
# composer install runs on the GitHub Actions runner; vendor/ is uploaded via rsync.
#
# SECURE server layout:
#   /home/curac/file-server/              ← PHP source + vendor/ OUTSIDE public_html
#   /home/curac/public_html/umis/cdn/     ← ONLY file-server/public/ (web entry point)
#
# !! AFTER FIRST SUCCESSFUL DEPLOY: delete public_html/umis/file-server/ via cPanel
#    File Manager — it currently exposes source code on the web.
#
# Required GitHub Secrets  (repo → Settings → Secrets and variables → Actions → Secrets):
#   SFTP_PRIVATE_KEY  — private key whose public half is in server ~/.ssh/authorized_keys
#   FILE_SERVER_ENV   — full contents of file-server/.env.production

on:
  push:
    branches: [main]
    paths:
      - 'file-server/**'
      - '.github/workflows/deploy-file-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-file-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy File Server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: composer install (no dev, optimized)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: file-server

      - name: Create file-server/.env from secret
        env:
          FILE_SERVER_ENV: ${{ secrets.FILE_SERVER_ENV }}
        run: printf '%s' "$FILE_SERVER_ENV" > file-server/.env

      - name: Ensure storage/uploads placeholder exists
        run: mkdir -p file-server/storage/uploads && touch file-server/storage/uploads/.gitkeep

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SFTP_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 cur.ac.rw >> ~/.ssh/known_hosts 2>/dev/null || true

      # Source + vendor/ + .env → ~/file-server/ (outside public_html)
      # storage/uploads/* excluded — never overwrite user-uploaded files
      - name: rsync file-server source → ~/file-server/
        run: |
          rsync -avz \
            --exclude='.DS_Store' \
            --exclude='__MACOSX/' \
            --exclude='public/' \
            --exclude='storage/uploads/*' \
            --exclude='composer.phar' \
            -e "ssh -p 22" \
            file-server/ \
            curac@cur.ac.rw:~/file-server/

      # Only file-server/public/ → ~/public_html/umis/cdn/
      - name: rsync file-server/public/ → public_html/umis/cdn/
        run: |
          rsync -avz --delete \
            --exclude='.DS_Store' \
            --exclude='__MACOSX/' \
            -e "ssh -p 22" \
            file-server/public/ \
            curac@cur.ac.rw:~/public_html/umis/cdn/

      - name: Write job summary
        if: always()
        run: |
          echo "## File Server Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`~/file-server/\` (outside public_html) |" >> $GITHUB_STEP_SUMMARY
          echo "| Web root | \`~/public_html/umis/cdn/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | https://cur.ac.rw/umis/cdn/health |" >> $GITHUB_STEP_SUMMARY
