name: Deploy — File Server (CDN)

# Method: cPanel UAPI (port 2083) upload + cPanel API2 Fileman::fileop extract —
# the same as deploy-backend.yml. No PHP file is uploaded: the server's security
# layer blocks .php uploads through the cPanel API, which is why the old
# extractor-helper method stopped deploying. composer install runs on the GitHub
# Actions runner; vendor/ is zipped and uploaded.
#
# Extraction merges into the target directory: files in the zip replace their
# old copies, everything else (storage/uploads/*, which the zip excludes) stays.
#
# Server layout after deploy:
#   /home/curac/file-server/          — PHP source + vendor/ (outside public_html)
#   /home/curac/public_html/umis/cdn/ — only file-server/public/ (web entry point)
#
# Required GitHub Secrets:
#   CPANEL_API_TOKEN  — cPanel API token (same one deploy-backend.yml uses)
#   DEPLOY_KEY        — backend deploy key, used to clear OPcache after the extract
#   FILE_SERVER_KEY   — the shared upload key; MUST equal FILE_SERVER_KEY in the
#                       live backend's .env, else every upload returns 401
#   FILE_SERVER_ENV   — legacy: full .env contents (key read from it only if
#                       FILE_SERVER_KEY is unset)

on:
  push:
    branches: [main]
    paths:
      - 'file-server/**'
      - '.github/workflows/deploy-file-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-file-server
  cancel-in-progress: false

env:
  # cPanel host (UAPI on :2083).
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac
  API_BASE: https://cur.ac.rw/umis/api

jobs:
  deploy:
    name: Deploy File Server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: composer install (no dev, optimized)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: file-server

      # ── Production .env ──────────────────────────────────────────────────────
      # `file-server/.env.production` is gitignored, so it does NOT exist on the
      # runner — the key can only come from a secret. Two accepted sources:
      #   FILE_SERVER_KEY  — just the key (preferred; simple to set correctly)
      #   FILE_SERVER_ENV  — full .env contents (legacy)
      # Everything else is composed here so production can never inherit a dev
      # default: APP_ENV=production makes the server refuse the fallback key.
      - name: Compose production file-server/.env
        env:
          FILE_SERVER_KEY: ${{ secrets.FILE_SERVER_KEY }}
          FILE_SERVER_ENV: ${{ secrets.FILE_SERVER_ENV }}
        run: |
          KEY="$FILE_SERVER_KEY"

          # Fall back to reading the key out of the legacy full-env secret.
          if [ -z "$KEY" ] && [ -n "$FILE_SERVER_ENV" ]; then
            KEY=$(printf '%s' "$FILE_SERVER_ENV" \
              | sed -n 's/^[[:space:]]*FILE_SERVER_KEY[[:space:]]*=[[:space:]]*//p' \
              | head -n1 | tr -d '\r')
          fi

          if [ -z "$KEY" ] || [ "$KEY" = "development_key_change_me" ]; then
            echo "::error::No usable FILE_SERVER_KEY. Set the repo secret FILE_SERVER_KEY to the same value as FILE_SERVER_KEY in the live backend's .env."
            exit 1
          fi

          {
            echo 'APP_NAME="CurMis File Server"'
            echo 'APP_ENV=production'
            echo 'APP_DEBUG=false'
            echo ''
            echo "FILE_SERVER_KEY=$KEY"
            echo 'MAX_UPLOAD_SIZE=50M'
          } > file-server/.env

          echo "Composed .env (key masked):"
          sed 's/^FILE_SERVER_KEY=.*/FILE_SERVER_KEY=***/' file-server/.env

      - name: Ensure storage/uploads placeholder exists
        run: mkdir -p file-server/storage/uploads && touch file-server/storage/uploads/.gitkeep

      # ── Archive 1: source + vendor/ + .env ───────────────────────────────────
      # storage/uploads/* excluded — never overwrite user-uploaded files.
      - name: Create file-server source archive
        run: |
          cd file-server
          zip -r ../fileserver-src.zip . \
            --exclude './public/*' \
            --exclude './storage/uploads/*' \
            --exclude './*.phar' \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ..
          echo "Source archive: $(du -sh fileserver-src.zip | cut -f1)"

      # ── Archive 2: file-server/public/ only ──────────────────────────────────
      - name: Create file-server public archive
        run: |
          cd file-server/public
          zip -r ../../fileserver-public.zip . \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ../..
          echo "Public archive: $(du -sh fileserver-public.zip | cut -f1)"

      # The university server's firewall drops connections from GitHub-hosted
      # runners. Probe cPanel first: when it is unreachable, skip the deploy
      # steps with a loud warning instead of failing the run — the steps above
      # have already validated the build. Deploy manually from an allowed
      # network until the firewall allowlists GitHub's runner IP ranges.
      - name: Preflight — is cPanel reachable from this runner?
        id: preflight
        run: |
          if curl -sk --connect-timeout 15 --max-time 25 -o /dev/null "$CPANEL_URL/login"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "cPanel reachable — deploying."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped — cPanel unreachable::$CPANEL_URL refuses connections from GitHub-hosted runners (server firewall). The build passed; deploy from an allowed network."
          fi

      # ── Upload & extract ──────────────────────────────────────────────────────
      # Same helpers as deploy-backend.yml: token-authenticated upload, then the
      # server extracts the zip itself (no PHP helper). Retries ride out the
      # server's intermittent connection drops.
      - name: Upload & extract file-server source → ~/file-server/ and public/ → public_html/umis/cdn/
        if: steps.preflight.outputs.reachable == 'true'
        timeout-minutes: 5
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          up() {
            local f="$1" d="$2" r s i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
                -F "dir=$d" -F "overwrite=1" -F "file-1=@$f" \
                "$CPANEL_URL/execute/Fileman/upload_files" || true)
              s=$(printf '%s' "$r" | jq -r '.status // 0' 2>/dev/null || echo 0)
              [ "$s" = "1" ] && { echo "upload $(basename "$f") -> $d: ok"; return 0; }
              echo "upload $(basename "$f") -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }
          ex() {
            local z="$1" d="$2" r i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
                "$CPANEL_URL/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=extract&sourcefiles=$z&destfiles=$d&doubledecode=0" || true)
              if printf '%s' "$r" | jq -e '(.cpanelresult.error // "") == "" and .cpanelresult.data' >/dev/null 2>&1; then
                echo "extract $z -> $d: ok"; return 0
              fi
              echo "extract $z -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }

          # Source zip carries .env (the upload key), so it stays in the home root, off the web.
          up fileserver-src.zip /
          ex /fileserver-src.zip /file-server

          up fileserver-public.zip /public_html/umis/cdn
          ex /public_html/umis/cdn/fileserver-public.zip /public_html/umis/cdn

      - name: Clear OPcache
        if: steps.preflight.outputs.reachable == 'true'
        timeout-minutes: 1
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # Same account and PHP pool as the backend: its cache-clear resets the
          # cached copy of the file server's code too. Repeated because each
          # PHP-FPM worker keeps its own OPcache.
          for i in $(seq 1 12); do
            RESULT=$(curl -s -k --max-time 15 -X POST \
              -H "Authorization: Bearer $DEPLOY_KEY" \
              "$API_BASE/api/deploy/cache-clear" || true)
            echo "Cache clear #$i: $RESULT"
          done

      # ── Verify ───────────────────────────────────────────────────────────────
      # Proves ~/file-server/.env actually landed and the key is live. Posting no
      # file is deliberate — nothing is stored, and the outcomes are distinct:
      #   "No file provided" → key accepted (deploy good)
      #   "Invalid API Key"  → .env missing on the server, or key mismatch
      - name: Verify file server accepts the deployed key
        if: steps.preflight.outputs.reachable == 'true'
        env:
          FILE_SERVER_KEY: ${{ secrets.FILE_SERVER_KEY }}
          FILE_SERVER_ENV: ${{ secrets.FILE_SERVER_ENV }}
        run: |
          KEY="$FILE_SERVER_KEY"
          if [ -z "$KEY" ] && [ -n "$FILE_SERVER_ENV" ]; then
            KEY=$(printf '%s' "$FILE_SERVER_ENV" \
              | sed -n 's/^[[:space:]]*FILE_SERVER_KEY[[:space:]]*=[[:space:]]*//p' \
              | head -n1 | tr -d '\r')
          fi

          echo "Health:"
          curl -s -k -m 20 "https://cur.ac.rw/umis/cdn/health"; echo

          BODY=$(curl -s -k -m 20 -X POST "https://cur.ac.rw/umis/cdn/upload" -H "X-API-Key: $KEY")
          echo "Auth probe: $BODY"

          case "$BODY" in
            *"No file provided"*)
              echo "Key accepted — applicant document upload is working." ;;
            *"Invalid API Key"*)
              echo "::error::Server rejected the deployed key. ~/file-server/.env did not land, or it differs from the backend's FILE_SERVER_KEY."
              exit 1 ;;
            *misconfigured*)
              echo "::error::Server booted without a FILE_SERVER_KEY — ~/file-server/.env is missing or empty."
              exit 1 ;;
            *)
              echo "::error::Unexpected response from the file server."
              exit 1 ;;
          esac

      - name: Write job summary
        if: always()
        run: |
          echo "## File Server Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Upload | ${{ steps.preflight.outputs.reachable == 'true' && 'deployed' || 'SKIPPED — cPanel unreachable from GitHub runners' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`~/file-server/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web root | \`~/public_html/umis/cdn/\` |" >> $GITHUB_STEP_SUMMARY
