name: Deploy — File Server (CDN)

# Method: cPanel UAPI over HTTPS (port 2083) — SSH/FTP blocked on this server.
# composer install runs on the GitHub Actions runner; vendor/ is zipped and uploaded.
#
# Server layout after deploy:
#   /home/curac/file-server/              — PHP source + vendor/ (outside public_html)
#   /home/curac/public_html/umis/cdn/     — only file-server/public/ (web entry point)
#
# Required GitHub Secrets:
#   CPANEL_PASS       — cPanel account password
#   FILE_SERVER_ENV   — full contents of file-server/.env.production

on:
  push:
    branches: [main]
    paths:
      - 'file-server/**'
      - '.github/workflows/deploy-file-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-file-server
  cancel-in-progress: false

env:
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac

jobs:
  deploy:
    name: Deploy File Server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: composer install (no dev, optimized)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: file-server

      - name: Create file-server/.env from secret
        env:
          FILE_SERVER_ENV: ${{ secrets.FILE_SERVER_ENV }}
        run: printf '%s' "$FILE_SERVER_ENV" > file-server/.env

      - name: Ensure storage/uploads placeholder exists
        run: mkdir -p file-server/storage/uploads && touch file-server/storage/uploads/.gitkeep

      # ── Archive 1: source + vendor/ + .env → ~/file-server/ ─────────────────
      # storage/uploads/* excluded — never overwrite user-uploaded files.
      - name: Create file-server source archive
        run: |
          cd file-server
          zip -r ../fileserver-src.zip . \
            --exclude './public/*' \
            --exclude './storage/uploads/*' \
            --exclude './*.phar' \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ..
          echo "Source archive: $(du -sh fileserver-src.zip | cut -f1)"

      # ── Archive 2: file-server/public/ only → ~/public_html/umis/cdn/ ────────
      - name: Create file-server public archive
        run: |
          cd file-server/public
          zip -r ../../fileserver-public.zip . \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ../..
          echo "Public archive: $(du -sh fileserver-public.zip | cut -f1)"

      # ── Ensure ~/file-server/ directory exists on server ─────────────────────
      - name: Ensure ~/file-server/ directory exists
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -G \
            --data-urlencode "path=/" \
            --data-urlencode "name=file-server" \
            "$CPANEL_URL/execute/Fileman/mkdir" > /dev/null || true

      # ── Deploy source to ~/file-server/ ──────────────────────────────────────
      - name: Upload file-server source → ~/file-server/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          # Remove leftover zip from any previous failed run
          echo "Pre-delete: $(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" -G \
            --data-urlencode "files-0-file=/file-server/fileserver-src.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files")" || true

          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/file-server" \
            -F "overwrite=1" \
            -F "file-1=@fileserver-src.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload: $RESPONSE"
          [ "$(echo "$RESPONSE" | jq -r '.status // 0')" = "1" ] || { echo "Upload failed"; exit 1; }

      - name: Extract file-server source on server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -G \
            --data-urlencode "cpanel_jsonapi_version=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=extractfile" \
            --data-urlencode "file=/file-server/fileserver-src.zip" \
            --data-urlencode "dir=/file-server/" \
            "https://cpanel.cur.ac.rw:2083/json-api/cpanel")
          echo "Extract: $RESPONSE"
          ERROR=$(echo "$RESPONSE" | jq -r '.cpanelresult.error // ""')
          [ -z "$ERROR" ] || { echo "Extract failed: $ERROR"; exit 1; }

      - name: Delete source archive from server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" -G \
            --data-urlencode "files-0-file=/file-server/fileserver-src.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files" > /dev/null

      # ── Deploy public/ to ~/public_html/umis/cdn/ ────────────────────────────
      - name: Upload file-server/public/ → public_html/umis/cdn/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          # Remove leftover zip from any previous failed run
          echo "Pre-delete: $(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" -G \
            --data-urlencode "files-0-file=/public_html/umis/cdn/fileserver-public.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files")" || true

          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis/cdn" \
            -F "overwrite=1" \
            -F "file-1=@fileserver-public.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload: $RESPONSE"
          [ "$(echo "$RESPONSE" | jq -r '.status // 0')" = "1" ] || { echo "Upload failed"; exit 1; }

      - name: Extract file-server public on server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -G \
            --data-urlencode "cpanel_jsonapi_version=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=extractfile" \
            --data-urlencode "file=/public_html/umis/cdn/fileserver-public.zip" \
            --data-urlencode "dir=/public_html/umis/cdn/" \
            "https://cpanel.cur.ac.rw:2083/json-api/cpanel")
          echo "Extract: $RESPONSE"
          ERROR=$(echo "$RESPONSE" | jq -r '.cpanelresult.error // ""')
          [ -z "$ERROR" ] || { echo "Extract failed: $ERROR"; exit 1; }

      - name: Delete public archive from server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" -G \
            --data-urlencode "files-0-file=/public_html/umis/cdn/fileserver-public.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files" > /dev/null

      - name: Write job summary
        if: always()
        run: |
          echo "## File Server Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`~/file-server/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web root | \`~/public_html/umis/cdn/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | https://cur.ac.rw/umis/cdn/health |" >> $GITHUB_STEP_SUMMARY
