name: Deploy — Backend (PHP API)

# Method: cPanel UAPI (port 2083) for upload; PHP helper for extraction.
#         cPanel has no zip-extract API — .github/scripts/ templates handle it.
# composer install runs on the GitHub Actions runner; vendor/ is zipped and uploaded.
#
# Server layout after deploy:
#   /home/curac/backend/              — PHP source + vendor/ (outside public_html)
#   /home/curac/public_html/umis/api/ — only backend/public/ (web entry point)
#
# Required GitHub Secrets:
#   CPANEL_PASS   — cPanel account password
#   BACKEND_ENV   — full contents of backend/.env.production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac

jobs:
  deploy:
    name: Deploy PHP Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: composer install (no dev, optimized)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend

      - name: Create backend/.env from secret
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: printf '%s' "$BACKEND_ENV" > backend/.env

      # ── Archive 1: backend source + vendor/ + .env → ~/backend/ ─────────────
      - name: Create backend source archive
        run: |
          cd backend
          zip -r ../backend-src.zip . \
            --exclude './public/*' \
            --exclude './*.phar' \
            --exclude './test_*.php' \
            --exclude './logs/*.log' \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ..
          echo "Source archive: $(du -sh backend-src.zip | cut -f1)"

      # ── Archive 2: backend/public/ only → ~/public_html/umis/api/ ───────────
      - name: Create backend public archive
        run: |
          cd backend/public
          zip -r ../../backend-public.zip . \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ../..
          echo "Public archive: $(du -sh backend-public.zip | cut -f1)"

      # ── Deploy source to ~/backend/ ──────────────────────────────────────────
      # Zip is uploaded to home root (NOT public_html) to keep source off the web.
      # Extraction is triggered via a one-time PHP script placed in public_html/umis/api/.
      # The script calculates home = __DIR__/../../.. (api→umis→public_html→home).
      - name: Upload & extract backend source → ~/backend/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          TOKEN=$(openssl rand -hex 16)

          # Inject placeholders: token, offset to home dir, zip name, destination dir
          sed -e "s/DEPLOY_TOKEN/$TOKEN/" \
              -e "s|DEPLOY_OFFSET|/../../..|" \
              -e "s/DEPLOY_ZIP_NAME/backend-src.zip/" \
              -e "s/DEPLOY_DEST_DIR/backend/" \
              .github/scripts/extract-from-home.php > _extract_src.php

          # Upload zip to home root (not inside public_html)
          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/" \
            -F "overwrite=1" \
            -F "file-1=@backend-src.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload zip: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Zip upload failed"; exit 1; }

          # Upload extractor to api/ (web-accessible)
          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis/api" \
            -F "overwrite=1" \
            -F "file-1=@_extract_src.php;type=text/plain" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload extractor: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Extractor upload failed"; exit 1; }

          # Trigger extraction — script self-destructs and deletes the zip
          RESULT=$(curl -s -k "https://cur.ac.rw/umis/api/_extract_src.php?token=$TOKEN")
          echo "Extract result: $RESULT"
          [ "$RESULT" = "ok" ] || { echo "Extraction failed: $RESULT"; exit 1; }

      # ── Deploy public/ to ~/public_html/umis/api/ ────────────────────────────
      - name: Upload & extract backend/public/ → public_html/umis/api/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          TOKEN=$(openssl rand -hex 16)

          sed -e "s/DEPLOY_TOKEN/$TOKEN/" \
              -e "s/DEPLOY_ZIP_NAME/backend-public.zip/" \
              .github/scripts/extract-inplace.php > _extract_pub.php

          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis/api" \
            -F "overwrite=1" \
            -F "file-1=@backend-public.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload zip: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Zip upload failed"; exit 1; }

          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis/api" \
            -F "overwrite=1" \
            -F "file-1=@_extract_pub.php;type=text/plain" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload extractor: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Extractor upload failed"; exit 1; }

          RESULT=$(curl -s -k "https://cur.ac.rw/umis/api/_extract_pub.php?token=$TOKEN")
          echo "Extract result: $RESULT"
          [ "$RESULT" = "ok" ] || { echo "Extraction failed: $RESULT"; exit 1; }

      - name: Write job summary
        if: always()
        run: |
          echo "## Backend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`~/backend/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web root | \`~/public_html/umis/api/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | https://cur.ac.rw/umis/api/api/health |" >> $GITHUB_STEP_SUMMARY
