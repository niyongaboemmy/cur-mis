name: Deploy — Backend (PHP API)

# Method: cPanel UAPI (port 2083) upload + one-time PHP helpers for extraction.
# composer install runs on the GitHub Actions runner; vendor/ is zipped and uploaded.
#
# Extraction — stage-then-swap:
#   Each zip is extracted to a temp dir, then files are rename()d into place.
#   rename() is atomic on the same filesystem — near-zero window of mixed files.
#
# Deploy order:
#   1. Extract new source code to ~/backend/
#   2. Extract new public/ entry point to ~/public_html/umis/api/
#   3. Clear OPcache via POST /api/deploy/cache-clear
#   NOTE: Migrations are run manually after deployment.
#
# Server layout after deploy:
#   /home/curac/backend/              — PHP source + vendor/ (outside public_html)
#   /home/curac/public_html/umis/api/ — only backend/public/ (web entry point)
#
# Required GitHub Secrets:
#   CPANEL_PASS   — cPanel account password
#   BACKEND_ENV   — full contents of backend/.env (including DEPLOY_KEY)
#   DEPLOY_KEY    — same value as DEPLOY_KEY in backend/.env

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac
  API_BASE: https://cur.ac.rw/umis/api

  # Staged inplace extractor: extracts to temp dir, renames into __DIR__, OPcache reset.
  # Placeholders: DEPLOY_TOKEN, DEPLOY_ZIP_NAME
  EXTRACTOR_INPLACE_B64: 

  # Staged from-home extractor: zip in home root → extracted to home subdir, OPcache reset.
  # Placeholders: DEPLOY_TOKEN, DEPLOY_OFFSET, DEPLOY_ZIP_NAME, DEPLOY_DEST_DIR
  EXTRACTOR_HOME_B64: 

jobs:
  deploy:
    name: Deploy PHP Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: composer install (no dev, optimized)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend

      - name: Create backend/.env from secret
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: printf '%s' "$BACKEND_ENV" > backend/.env

      # ── Archive 1: source + vendor/ + .env ───────────────────────────────────
      - name: Create backend source archive
        run: |
          cd backend
          zip -r ../backend-src.zip . \
            --exclude './public/*' \
            --exclude './*.phar' \
            --exclude './test_*.php' \
            --exclude './logs/*.log' \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ..
          echo "Source archive: $(du -sh backend-src.zip | cut -f1)"

      # ── Archive 2: backend/public/ only ──────────────────────────────────────
      - name: Create backend public archive
        run: |
          cd backend/public
          zip -r ../../backend-public.zip . \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ../..
          echo "Public archive: $(du -sh backend-public.zip | cut -f1)"

      # ── Step 1: Deploy source to ~/backend/ ───────────────────────────────────
      # Zip goes to home root (outside public_html — keeps source off the web).
      # Extractor placed in api/ (web-accessible) calculates home via __DIR__/../../..
      - name: Upload & extract backend source → ~/backend/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          TOKEN=$(openssl rand -hex 16)

          echo "$EXTRACTOR_HOME_B64" | base64 -d \
            | sed -e "s/DEPLOY_TOKEN/$TOKEN/" \
                  -e "s|DEPLOY_OFFSET|/../../..|" \
                  -e "s/DEPLOY_ZIP_NAME/backend-src.zip/" \
                  -e "s/DEPLOY_DEST_DIR/backend/" \
            > _extract_src.php

          # Upload zip to home root (not in public_html)
          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/" \
            -F "overwrite=1" \
            -F "file-1=@backend-src.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload zip: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Zip upload failed"; exit 1; }

          # Upload extractor to api/ (web-accessible)
          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis/api" \
            -F "overwrite=1" \
            -F "file-1=@_extract_src.php;type=text/plain" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload extractor: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Extractor upload failed"; exit 1; }

          RESULT=$(curl -s -k "https://cur.ac.rw/umis/api/_extract_src.php?token=$TOKEN")
          echo "Extract result: $RESULT"
          [ "$RESULT" = "ok" ] || { echo "Extraction failed: $RESULT"; exit 1; }

      # ── Step 2: Deploy public/ to ~/public_html/umis/api/ ─────────────────────
      # NOTE: Migrations are run manually after each deployment.
      - name: Upload & extract backend/public/ → public_html/umis/api/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          TOKEN=$(openssl rand -hex 16)

          echo "$EXTRACTOR_INPLACE_B64" | base64 -d \
            | sed -e "s/DEPLOY_TOKEN/$TOKEN/" -e "s/DEPLOY_ZIP_NAME/backend-public.zip/" \
            > _extract_pub.php

          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis/api" \
            -F "overwrite=1" \
            -F "file-1=@backend-public.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload zip: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Zip upload failed"; exit 1; }

          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis/api" \
            -F "overwrite=1" \
            -F "file-1=@_extract_pub.php;type=text/plain" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload extractor: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Extractor upload failed"; exit 1; }

          RESULT=$(curl -s -k "https://cur.ac.rw/umis/api/_extract_pub.php?token=$TOKEN")
          echo "Extract result: $RESULT"
          [ "$RESULT" = "ok" ] || { echo "Extraction failed: $RESULT"; exit 1; }

      # ── Step 4: Clear OPcache so new PHP files are served immediately ──────────
      - name: Clear OPcache
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          RESULT=$(curl -s -k -X POST \
            -H "Authorization: Bearer $DEPLOY_KEY" \
            "$API_BASE/api/deploy/cache-clear")
          echo "Cache clear: $RESULT"

      - name: Write job summary
        if: always()
        run: |
          echo "## Backend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`~/backend/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web root | \`~/public_html/umis/api/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run migrations manually | \`POST $API_BASE/api/deploy/migrate\` |" >> $GITHUB_STEP_SUMMARY
