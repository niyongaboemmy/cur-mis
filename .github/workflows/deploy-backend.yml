name: Deploy — Backend (PHP API)

# Method: rsync over SFTP (port 22) — server does not support FTP/FTPS
# composer install runs on the GitHub Actions runner; vendor/ is uploaded via rsync.
#
# SECURE server layout:
#   /home/curac/backend/              ← PHP source + vendor/ OUTSIDE public_html
#   /home/curac/public_html/umis/api/ ← ONLY backend/public/ (web entry point)
#
# !! AFTER FIRST SUCCESSFUL DEPLOY: delete public_html/umis/backend/ via cPanel
#    File Manager — it currently exposes source + .env on the web.
#
# Required GitHub Secrets  (repo → Settings → Secrets and variables → Actions → Secrets):
#   SFTP_PRIVATE_KEY  — private key whose public half is in server ~/.ssh/authorized_keys
#   BACKEND_ENV       — full contents of backend/.env.production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PHP Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: composer install (no dev, optimized)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend

      - name: Create backend/.env from secret
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: printf '%s' "$BACKEND_ENV" > backend/.env

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SFTP_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 cur.ac.rw >> ~/.ssh/known_hosts 2>/dev/null || true

      # Source + vendor/ + .env → ~/backend/ (outside public_html)
      # public/ excluded here — deployed separately below
      - name: rsync backend source → ~/backend/
        run: |
          rsync -avz \
            --exclude='.DS_Store' \
            --exclude='__MACOSX/' \
            --exclude='public/' \
            --exclude='logs/' \
            --exclude='storage/uploads/*' \
            --exclude='composer.phar' \
            --exclude='test_*.php' \
            -e "ssh -p 22" \
            backend/ \
            curac@cur.ac.rw:~/backend/

      # Only backend/public/ → ~/public_html/umis/api/ (web entry point)
      # --delete cleans up accidental files (Windows error log etc.)
      - name: rsync backend/public/ → public_html/umis/api/
        run: |
          rsync -avz --delete \
            --exclude='.DS_Store' \
            --exclude='__MACOSX/' \
            -e "ssh -p 22" \
            backend/public/ \
            curac@cur.ac.rw:~/public_html/umis/api/

      - name: Write job summary
        if: always()
        run: |
          echo "## Backend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`~/backend/\` (outside public_html) |" >> $GITHUB_STEP_SUMMARY
          echo "| Web root | \`~/public_html/umis/api/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | https://cur.ac.rw/umis/api/api/health |" >> $GITHUB_STEP_SUMMARY
