name: Deploy — Backend (PHP API)

# Method: cPanel UAPI (port 2083) upload + one-time PHP helpers for extraction.
#
# Two-zip strategy (fast updates):
#   backend-src.zip   — source code only (no vendor/), ~300 KB, deployed every push
#   backend-vendor.zip — vendor/ directory, ~15 MB, deployed ONLY when composer.lock changes
#
# Extraction — stage-then-swap:
#   Each zip is extracted to a temp dir, then files are rename()d into place.
#   rename() is atomic on the same filesystem — near-zero window of mixed files.
#
# Deploy order:
#   1. vendor/ (if composer.lock changed)
#   2. Source code → public_html/umis/backend/
#   3. public/ entry point → public_html/umis/api/
#   4. Flush OPcache via fresh PHP helper
#   5. Clear OPcache via API
#
# This workflow deploys SOURCE CODE ONLY. It never touches the database —
# no migrations, no seeding. Run those separately and deliberately via:
#   .github/workflows/migrate-backend.yml (workflow_dispatch)
#   .github/workflows/seed-backend.yml     (workflow_dispatch, pick one seeder)
#
# Server layout after deploy (sibling layout — confirmed via cPanel File Manager):
#   /home/curac/public_html/umis/backend/ — PHP source + vendor/
#   /home/curac/public_html/umis/api/     — only backend/public/ (web entry point)
# index.php's BASE_PATH resolution picks this up via its
# `dirname(__DIR__) . '/backend'` check (sibling layout), since
# public_html/umis/backend/vendor/autoload.php already exists there.
#
# Required GitHub Secrets:
#   CPANEL_PASS   — cPanel account password
#   BACKEND_ENV   — full contents of backend/.env (including DEPLOY_KEY)
#   DEPLOY_KEY    — same value as DEPLOY_KEY in backend/.env

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  # cPanel host (UAPI on :2083).
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac
  API_BASE: https://cur.ac.rw/umis/api

  # Staged inplace extractor: extracts to temp dir, renames into __DIR__, OPcache reset.
  # Placeholders: DEPLOY_TOKEN, DEPLOY_ZIP_NAME
  EXTRACTOR_INPLACE_B64: 

  # Staged from-home extractor: zip in home root → extracted to home subdir, OPcache reset.
  # Placeholders: DEPLOY_TOKEN, DEPLOY_OFFSET, DEPLOY_ZIP_NAME, DEPLOY_DEST_DIR
  EXTRACTOR_HOME_B64: 

  # OPcache flush helper — self-deletes only on the last call (?last=1).
  # Called in a loop (rounds through FPM workers). Base64 of:
  #   <?php
  #   if (($_GET["token"] ?? "") !== "FLUSH_TOKEN") { http_response_code(403); die("forbidden"); }
  #   if (function_exists("opcache_reset")) {
  #       opcache_reset();
  #       if (!empty($_GET["last"])) { unlink(__FILE__); }
  #       echo "ok";
  #   } else {
  #       if (!empty($_GET["last"])) { unlink(__FILE__); }
  #       echo "no-opcache";
  #   }
  FLUSH_OPCACHE_B64: 

jobs:
  deploy:
    name: Deploy PHP Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need parent commit to detect composer.lock changes

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      # ── Detect if composer.lock changed ──────────────────────────────────────
      - name: Check if composer.lock changed
        id: composer_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q 'backend/composer.lock'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "composer.lock changed — vendor/ will be redeployed"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "composer.lock unchanged — skipping vendor/ deploy"
          fi

      # Only install when composer.lock changed (saves ~30 s on every push)
      - name: composer install (only when composer.lock changed)
        if: steps.composer_changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend

      # ── Archive A: source code only (no vendor/) — always, ~300 KB ──────────
      # NEVER ship .env or .htaccess — those live on the server and are managed
      # manually. Overwriting .env wipes DB credentials and breaks the app.
      - name: Create backend source archive (no vendor/)
        run: |
          cd backend
          zip -r ../backend-src.zip . \
            --exclude './vendor/*' \
            --exclude './vendor/**' \
            --exclude './public/*' \
            --exclude './public/**' \
            --exclude './docs/*' \
            --exclude './docs/**' \
            --exclude './.env' \
            --exclude './*.phar' \
            --exclude './.htaccess' \
            --exclude './test_*.php' \
            --exclude './logs/*.log' \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ..
          echo "Source archive: $(du -sh backend-src.zip | cut -f1)"

      # ── Archive B: vendor/ only — only when composer.lock changed, ~15 MB ───
      - name: Create vendor archive (only when composer.lock changed)
        if: steps.composer_changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd backend
          zip -r ../backend-vendor.zip vendor/ \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ..
          echo "Vendor archive: $(du -sh backend-vendor.zip | cut -f1)"

      # ── Archive C: backend/public/ only ──────────────────────────────────────
      - name: Create backend public archive
        run: |
          cd backend/public
          zip -r ../../backend-public.zip . \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ../..
          echo "Public archive: $(du -sh backend-public.zip | cut -f1)"

      # The university server's firewall drops connections from GitHub-hosted
      # runners (every run since 2026-08-20 died with curl exit 28 at the first
      # upload, after all build steps passed). Probe cPanel first: when it is
      # unreachable, skip the deploy steps with a loud warning instead of
      # failing the run — the steps above have already validated the code.
      # Ship from an allowed network with `bash deploy-from-local.sh backend`
      # until the firewall allowlists GitHub's runner IP ranges
      # (https://api.github.com/meta).
      - name: Preflight — is cPanel reachable from this runner?
        id: preflight
        # The block is intermittent, not absolute: a single probe kept
        # declaring the server unreachable on runs whose upload would have
        # worked. Probe up to 6 times over ~2 minutes and only give up if
        # every attempt fails.
        run: |
          reach=false
          for i in 1 2 3 4 5 6; do
            if curl -sk --connect-timeout 20 --max-time 30 -o /dev/null "$CPANEL_URL/login"; then
              reach=true; echo "cPanel reachable on attempt $i — deploying."; break
            fi
            echo "attempt $i: no answer from $CPANEL_URL"
            [ $i -lt 6 ] && sleep 20
          done
          echo "reachable=$reach" >> "$GITHUB_OUTPUT"
          if [ "$reach" != "true" ]; then
            echo "::warning title=Deploy skipped — cPanel unreachable::$CPANEL_URL did not answer in 6 attempts over 2 minutes (server firewall). The build passed; deploy from an allowed network: CPANEL_PASS='...' bash deploy-from-local.sh"
          fi
      # ── Step 1 (conditional): Deploy vendor/ → public_html/umis/backend/vendor/ ─
      # NOTE: backend/ lives INSIDE public_html/umis/ as a sibling of api/
      # (confirmed via cPanel File Manager) — NOT in the home root. index.php's
      # BASE_PATH check #2 (`dirname(__DIR__) . '/backend'`) is what resolves
      # at runtime, since public_html/umis/backend/vendor/autoload.php already
      # exists there from an earlier manual deploy.
      - name: Upload & extract vendor/ → public_html/umis/backend/vendor/
        if: steps.preflight.outputs.reachable == 'true' && (steps.composer_changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 8
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          up() {
            local f="$1" d="$2" r s i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -u "$CPANEL_USER:$CPANEL_PASS" \
                -F "dir=$d" -F "overwrite=1" -F "file-1=@$f" \
                "$CPANEL_URL/execute/Fileman/upload_files" || true)
              s=$(printf '%s' "$r" | jq -r '.status // 0' 2>/dev/null || echo 0)
              [ "$s" = "1" ] && { echo "upload $(basename "$f") -> $d: ok"; return 0; }
              echo "upload $(basename "$f") -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }
          ex() {
            local z="$1" d="$2" r i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -u "$CPANEL_USER:$CPANEL_PASS" \
                "$CPANEL_URL/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=extract&sourcefiles=$z&destfiles=$d&doubledecode=0" || true)
              if printf '%s' "$r" | jq -e '(.cpanelresult.error // "") == "" and .cpanelresult.data' >/dev/null 2>&1; then
                echo "extract $z -> $d: ok"; return 0
              fi
              echo "extract $z -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }

          up backend-vendor.zip /public_html/umis
          ex /public_html/umis/backend-vendor.zip /public_html/umis/backend

      # ── Step 2: Deploy source code → public_html/umis/backend/ ────────────────
      - name: Upload & extract backend source → public_html/umis/backend/
        if: steps.preflight.outputs.reachable == 'true'
        timeout-minutes: 3
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          up() {
            local f="$1" d="$2" r s i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -u "$CPANEL_USER:$CPANEL_PASS" \
                -F "dir=$d" -F "overwrite=1" -F "file-1=@$f" \
                "$CPANEL_URL/execute/Fileman/upload_files" || true)
              s=$(printf '%s' "$r" | jq -r '.status // 0' 2>/dev/null || echo 0)
              [ "$s" = "1" ] && { echo "upload $(basename "$f") -> $d: ok"; return 0; }
              echo "upload $(basename "$f") -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }
          ex() {
            local z="$1" d="$2" r i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -u "$CPANEL_USER:$CPANEL_PASS" \
                "$CPANEL_URL/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=extract&sourcefiles=$z&destfiles=$d&doubledecode=0" || true)
              if printf '%s' "$r" | jq -e '(.cpanelresult.error // "") == "" and .cpanelresult.data' >/dev/null 2>&1; then
                echo "extract $z -> $d: ok"; return 0
              fi
              echo "extract $z -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }

          up backend-src.zip /public_html/umis
          ex /public_html/umis/backend-src.zip /public_html/umis/backend

      # ── Step 3: Deploy public/ entry point ────────────────────────────────────
      - name: Upload & extract backend/public/ → public_html/umis/api/
        if: steps.preflight.outputs.reachable == 'true'
        timeout-minutes: 2
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          up() {
            local f="$1" d="$2" r s i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -u "$CPANEL_USER:$CPANEL_PASS" \
                -F "dir=$d" -F "overwrite=1" -F "file-1=@$f" \
                "$CPANEL_URL/execute/Fileman/upload_files" || true)
              s=$(printf '%s' "$r" | jq -r '.status // 0' 2>/dev/null || echo 0)
              [ "$s" = "1" ] && { echo "upload $(basename "$f") -> $d: ok"; return 0; }
              echo "upload $(basename "$f") -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }
          ex() {
            local z="$1" d="$2" r i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -u "$CPANEL_USER:$CPANEL_PASS" \
                "$CPANEL_URL/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=extract&sourcefiles=$z&destfiles=$d&doubledecode=0" || true)
              if printf '%s' "$r" | jq -e '(.cpanelresult.error // "") == "" and .cpanelresult.data' >/dev/null 2>&1; then
                echo "extract $z -> $d: ok"; return 0
              fi
              echo "extract $z -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }

          up backend-public.zip /public_html/umis/api
          ex /public_html/umis/api/backend-public.zip /public_html/umis/api

      # ── Step 4 (retired): the flush helper was an uploaded PHP file, which
      # the server's security layer now blocks as a webshell. OPcache is
      # cleared through the backend's own authenticated endpoint below,
      # called repeatedly to round-robin across the FPM workers. ──────────────

      # ── Step 5: Clear OPcache via API ─────────────────────────────────────────
      # Deliberately does NOT run migrations or seeds — this workflow ships code
      # only. Run migrate-backend.yml / seed-backend.yml separately when needed.
      - name: Clear OPcache
        if: steps.preflight.outputs.reachable == 'true'
        timeout-minutes: 1
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # Called repeatedly: PHP-FPM workers each keep their own OPcache and
          # one request only clears whichever worker served it.
          for i in $(seq 1 12); do
            RESULT=$(curl -s -k --max-time 15 -X POST \
              -H "Authorization: Bearer $DEPLOY_KEY" \
              "$API_BASE/api/deploy/cache-clear" || true)
            echo "Cache clear #$i: $RESULT"
          done

      - name: Write job summary
        if: always()
        run: |
          echo "## Backend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Upload | ${{ steps.preflight.outputs.reachable == 'true' && 'deployed' || 'SKIPPED — cPanel unreachable from GitHub runners; run deploy-from-local.sh backend' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source (no vendor) | \`public_html/umis/backend/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Vendor redeployed | \`${{ steps.composer_changed.outputs.changed }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web root | \`~/public_html/umis/api/\` |" >> $GITHUB_STEP_SUMMARY
