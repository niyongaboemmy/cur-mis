name: Deploy — Backend (PHP API)

# Method: cPanel UAPI over HTTPS (port 2083) — SSH/FTP blocked on this server.
# composer install runs on the GitHub Actions runner; vendor/ is zipped and uploaded.
#
# Server layout after deploy:
#   /home/curac/backend/              — PHP source + vendor/ (outside public_html)
#   /home/curac/public_html/umis/api/ — only backend/public/ (web entry point)
#
# Required GitHub Secrets:
#   CPANEL_PASS   — cPanel account password
#   BACKEND_ENV   — full contents of backend/.env.production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac

jobs:
  deploy:
    name: Deploy PHP Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: composer install (no dev, optimized)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend

      - name: Create backend/.env from secret
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: printf '%s' "$BACKEND_ENV" > backend/.env

      # ── Archive 1: backend source + vendor/ + .env → ~/backend/ ─────────────
      # Excludes public/ (deployed separately) and unnecessary files.
      - name: Create backend source archive
        run: |
          cd backend
          zip -r ../backend-src.zip . \
            --exclude './public/*' \
            --exclude './*.phar' \
            --exclude './test_*.php' \
            --exclude './logs/*.log' \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ..
          echo "Source archive: $(du -sh backend-src.zip | cut -f1)"

      # ── Archive 2: backend/public/ only → ~/public_html/umis/api/ ───────────
      - name: Create backend public archive
        run: |
          cd backend/public
          zip -r ../../backend-public.zip . \
            --exclude './__MACOSX*' \
            --exclude './.DS_Store'
          cd ../..
          echo "Public archive: $(du -sh backend-public.zip | cut -f1)"

      # ── Ensure ~/backend/ directory exists on server ─────────────────────────
      - name: Ensure ~/backend/ directory exists
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -G \
            --data-urlencode "path=/" \
            --data-urlencode "name=backend" \
            "$CPANEL_URL/execute/Fileman/mkdir" > /dev/null || true

      # ── Deploy source to ~/backend/ ──────────────────────────────────────────
      - name: Upload backend source → ~/backend/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/backend" \
            -F "file-1=@backend-src.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload: $RESPONSE"
          [ "$(echo "$RESPONSE" | jq -r '.status // 0')" = "1" ] || { echo "Upload failed"; exit 1; }

      - name: Extract backend source on server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -G \
            --data-urlencode "cpanel_jsonapi_version=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=extractfile" \
            --data-urlencode "file=/backend/backend-src.zip" \
            --data-urlencode "dir=/backend/" \
            "https://cpanel.cur.ac.rw:2083/json-api/cpanel")
          echo "Extract: $RESPONSE"
          ERROR=$(echo "$RESPONSE" | jq -r '.cpanelresult.error // ""')
          [ -z "$ERROR" ] || { echo "Extract failed: $ERROR"; exit 1; }

      - name: Delete source archive from server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" -G \
            --data-urlencode "files-0-file=/backend/backend-src.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files" > /dev/null

      # ── Deploy public/ to ~/public_html/umis/api/ ────────────────────────────
      - name: Upload backend/public/ → public_html/umis/api/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis/api" \
            -F "file-1=@backend-public.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload: $RESPONSE"
          [ "$(echo "$RESPONSE" | jq -r '.status // 0')" = "1" ] || { echo "Upload failed"; exit 1; }

      - name: Extract backend public on server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -G \
            --data-urlencode "cpanel_jsonapi_version=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=extractfile" \
            --data-urlencode "file=/public_html/umis/api/backend-public.zip" \
            --data-urlencode "dir=/public_html/umis/api/" \
            "https://cpanel.cur.ac.rw:2083/json-api/cpanel")
          echo "Extract: $RESPONSE"
          ERROR=$(echo "$RESPONSE" | jq -r '.cpanelresult.error // ""')
          [ -z "$ERROR" ] || { echo "Extract failed: $ERROR"; exit 1; }

      - name: Delete public archive from server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" -G \
            --data-urlencode "files-0-file=/public_html/umis/api/backend-public.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files" > /dev/null

      - name: Write job summary
        if: always()
        run: |
          echo "## Backend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`~/backend/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web root | \`~/public_html/umis/api/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | https://cur.ac.rw/umis/api/api/health |" >> $GITHUB_STEP_SUMMARY
