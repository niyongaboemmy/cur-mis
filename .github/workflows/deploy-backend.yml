name: Deploy — Backend (PHP API)

# No SSH/terminal on cPanel — composer install runs on the GitHub Actions runner.
# The pre-built vendor/ is uploaded together with the source via FTP.
#
# SECURE server layout after this workflow runs:
#   /home/curac/backend/              ← PHP source + vendor/ OUTSIDE public_html
#   /home/curac/public_html/umis/api/ ← ONLY backend/public/ (web entry point)
#
# backend/public/index.php auto-detects BASE_PATH via DOCUMENT_ROOT:
#   DOCUMENT_ROOT = /home/curac/public_html/umis/api
#   → BASE_PATH   = /home/curac/backend   ✓
#
# !! AFTER FIRST SUCCESSFUL DEPLOY: delete public_html/umis/backend/ via
#    cPanel File Manager — it currently exposes source + .env on the web.
#
# Required GitHub Secrets  (repo → Settings → Secrets and variables → Actions → Secrets):
#   FTP_HOST        — e.g. cur.ac.rw  (or ftp.cur.ac.rw)
#   FTP_USERNAME    — curac
#   FTP_PASSWORD    — cPanel account password
#   BACKEND_ENV     — full contents of backend/.env (production)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PHP Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── PHP + Composer setup ──────────────────────────────────────────────────
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      # ── Build vendor/ locally ─────────────────────────────────────────────────
      - name: composer install (no dev, optimized)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend

      # ── Write .env from secret ────────────────────────────────────────────────
      # Creates backend/.env on the runner (gitignored, so not in checkout).
      # Uploaded to ~/backend/.env via FTP below — never exposed in git.
      - name: Create backend/.env from secret
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: printf '%s' "$BACKEND_ENV" > backend/.env

      # ── FTP: source + vendor/ → ~/backend/ ───────────────────────────────────
      # Everything except backend/public/ goes to the home directory (outside web).
      - name: FTP deploy backend source → ~/backend/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backend/
          server-dir: ./backend/
          exclude: |
            **/.DS_Store
            **/__MACOSX/**
            **/public/**
            **/logs/**
            **/composer.phar
            **/test_*.php
            **/.gitkeep

      # ── FTP: backend/public/ → ~/public_html/umis/api/ ───────────────────────
      # Only the web entry-point files go into the web-accessible folder.
      # --dangerous-clean-slate is NOT set — keeps server files not in git
      # (cPanel state files, etc.).
      - name: FTP deploy backend/public/ → public_html/umis/api/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backend/public/
          server-dir: ./public_html/umis/api/
          exclude: |
            **/.DS_Store
            **/__MACOSX/**

      - name: Write job summary
        if: always()
        run: |
          echo "## Backend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`~/backend/\` (outside public_html) |" >> $GITHUB_STEP_SUMMARY
          echo "| Web root | \`~/public_html/umis/api/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health URL | https://cur.ac.rw/umis/api/api/health |" >> $GITHUB_STEP_SUMMARY
