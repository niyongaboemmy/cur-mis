name: Deploy — Frontend (React SPA)

# Target: /home/curac/public_html/umis/
# URL:    https://cur.ac.rw/umis/
# Method: cPanel UAPI over HTTPS (port 2083) — SSH/FTP are blocked on this server.
#         Files are zipped, uploaded via cPanel File Manager API, then extracted in-place.
#
# Required GitHub Secret:
#   CPANEL_PASS — cPanel account password  (Settings → Secrets → Actions)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac

jobs:
  build-and-deploy:
    name: Build & Deploy React SPA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npm run type-check
        working-directory: frontend

      # frontend/.env.production is committed to git and loaded by Vite automatically.
      - name: Build production bundle
        run: npm run build
        working-directory: frontend

      # Zip dist/ contents at archive root so they extract directly into the target dir.
      - name: Create deployment archive
        run: |
          cd frontend/dist
          zip -r ../../frontend-deploy.zip . --exclude '*/.DS_Store' --exclude '*/__MACOSX*'
          cd ../..
          echo "Archive size: $(du -sh frontend-deploy.zip | cut -f1)"

      - name: Upload archive → public_html/umis/
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          # Remove leftover zip from any previous failed run
          echo "Pre-delete: $(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" -G \
            --data-urlencode "files-0-file=/public_html/umis/frontend-deploy.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files")" || true

          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis" \
            -F "overwrite=1" \
            -F "file-1=@frontend-deploy.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload response: $RESPONSE"
          STATUS=$(echo "$RESPONSE" | jq -r '.status // 0')
          [ "$STATUS" = "1" ] || { echo "Upload failed"; exit 1; }

      - name: Extract archive on server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          RESPONSE=$(curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -G \
            --data-urlencode "cpanel_jsonapi_version=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=extractfile" \
            --data-urlencode "file=/public_html/umis/frontend-deploy.zip" \
            --data-urlencode "dir=/public_html/umis/" \
            "https://cpanel.cur.ac.rw:2083/json-api/cpanel")
          echo "Extract response: $RESPONSE"
          ERROR=$(echo "$RESPONSE" | jq -r '.cpanelresult.error // ""')
          [ -z "$ERROR" ] || { echo "Extract failed: $ERROR"; exit 1; }

      - name: Delete archive from server
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          curl -s -k \
            -u "$CPANEL_USER:$CPANEL_PASS" \
            -G \
            --data-urlencode "files-0-file=/public_html/umis/frontend-deploy.zip" \
            --data-urlencode "files-0-type=file" \
            "$CPANEL_URL/execute/Fileman/delete_files" > /dev/null

      - name: Write job summary
        if: always()
        run: |
          echo "## Frontend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`/public_html/umis/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://cur.ac.rw/umis/ |" >> $GITHUB_STEP_SUMMARY
