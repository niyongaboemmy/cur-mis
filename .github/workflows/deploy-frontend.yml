name: Deploy — Frontend (React SPA)

# Target: /home/curac/public_html/umis/
# URL:    https://cur.ac.rw/umis/
# Method: rsync over SFTP (port 22) — server does not support FTP/FTPS
#
# Required GitHub Secrets  (repo → Settings → Secrets and variables → Actions → Secrets):
#   SFTP_PRIVATE_KEY  — contents of ~/.ssh/curac_deploy  (the private key)
#                       Generate: ssh-keygen -t ed25519 -C "github-deploy" -f ~/.ssh/curac_deploy
#                       Then add ~/.ssh/curac_deploy.pub to server /home/curac/.ssh/authorized_keys

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy React SPA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npm run type-check
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SFTP_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 cur.ac.rw >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: rsync dist → public_html/umis/
        run: |
          rsync -avz --delete \
            --exclude='.DS_Store' \
            --exclude='__MACOSX/' \
            --exclude='api/' \
            --exclude='backend/' \
            --exclude='cdn/' \
            --exclude='file-server/' \
            --exclude='template_docs/' \
            -e "ssh -p 22" \
            frontend/dist/ \
            curac@cur.ac.rw:~/public_html/umis/

      - name: Write job summary
        if: always()
        run: |
          echo "## Frontend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`~/public_html/umis/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://cur.ac.rw/umis/ |" >> $GITHUB_STEP_SUMMARY
