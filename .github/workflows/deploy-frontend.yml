name: Deploy — Frontend (React SPA)

# Target: /home/curac/public_html/umis/
# URL:    https://cur.ac.rw/umis/
# Method: cPanel UAPI (port 2083) upload + one-time PHP helper for extraction.
#
# Extraction — stage-then-swap:
#   Files are extracted to a temp dir, then rename()d into the live directory.
#   rename() is atomic on the same filesystem — near-zero window of mixed files.
#
# Required GitHub Secret:
#   CPANEL_PASS — cPanel account password

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  CPANEL_URL: https://cur.ac.rw:2083
  CPANEL_USER: curac
  EXTRACTOR_B64: 

jobs:
  build-and-deploy:
    name: Build & Deploy React SPA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npm run type-check
        working-directory: frontend

      # frontend/.env.production is committed to git and loaded by Vite automatically.
      - name: Build production bundle
        run: NODE_ENV=production npm run build
        working-directory: frontend
        env:
          NODE_ENV: production

      - name: Create deployment archive
        run: |
          cd frontend/dist
          zip -r ../../frontend-deploy.zip . --exclude '*/.DS_Store' --exclude '*/__MACOSX*'
          cd ../..
          echo "Archive size: $(du -sh frontend-deploy.zip | cut -f1)"

      # The university server's firewall drops connections from GitHub-hosted
      # runners (every run since 2026-08-20 died with curl exit 28 here, after
      # all build steps passed). Probe cPanel first: when it is unreachable,
      # skip the deploy steps with a loud warning instead of failing the run —
      # the build above has already validated the code. Ship from an allowed
      # network with `bash deploy-from-local.sh` until the firewall allowlists
      # GitHub's runner IP ranges (https://api.github.com/meta).
      - name: Preflight — is cPanel reachable from this runner?
        id: preflight
        run: |
          if curl -sk --connect-timeout 15 --max-time 25 -o /dev/null "$CPANEL_URL/login"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "cPanel reachable — deploying."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped — cPanel unreachable::$CPANEL_URL refuses connections from GitHub-hosted runners (server firewall). The build passed; deploy from an allowed network: CPANEL_PASS='...' bash deploy-from-local.sh frontend"
          fi

      - name: Upload & extract
        if: steps.preflight.outputs.reachable == 'true'
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          TOKEN=$(openssl rand -hex 16)

          echo "$EXTRACTOR_B64" | base64 -d \
            | sed -e "s/DEPLOY_TOKEN/$TOKEN/" -e "s/DEPLOY_ZIP_NAME/frontend-deploy.zip/" \
            > _extract.php

          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis" \
            -F "overwrite=1" \
            -F "file-1=@frontend-deploy.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload zip: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Zip upload failed"; exit 1; }

          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis" \
            -F "overwrite=1" \
            -F "file-1=@_extract.php;type=text/plain" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload extractor: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Extractor upload failed"; exit 1; }

          RESULT=$(curl -s -k "https://cur.ac.rw/umis/_extract.php?token=$TOKEN")
          echo "Extract result: $RESULT"
          [ "$RESULT" = "ok" ] || { echo "Extraction failed: $RESULT"; exit 1; }

      - name: Write job summary
        if: always()
        run: |
          echo "## Frontend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Upload | ${{ steps.preflight.outputs.reachable == 'true' && 'deployed' || 'SKIPPED — cPanel unreachable from GitHub runners; run deploy-from-local.sh' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`~/public_html/umis/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://cur.ac.rw/umis/ |" >> $GITHUB_STEP_SUMMARY
