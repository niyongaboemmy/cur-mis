name: Deploy — Frontend (React SPA)

# Target: /home/curac/public_html/umis/
# URL:    https://cur.ac.rw/umis/
# Method: cPanel UAPI (port 2083) upload + one-time PHP helper for extraction.
#
# Extraction — stage-then-swap:
#   Files are extracted to a temp dir, then rename()d into the live directory.
#   rename() is atomic on the same filesystem — near-zero window of mixed files.
#
# Required GitHub Secret:
#   CPANEL_PASS — cPanel account password

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  # cPanel host (UAPI on :2083).
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac
  EXTRACTOR_B64: 

jobs:
  build-and-deploy:
    name: Build & Deploy React SPA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npm run type-check
        working-directory: frontend

      # frontend/.env.production is committed to git and loaded by Vite automatically.
      - name: Build production bundle
        run: NODE_ENV=production npm run build
        working-directory: frontend
        env:
          NODE_ENV: production

      - name: Create deployment archive
        run: |
          cd frontend/dist
          zip -r ../../frontend-deploy.zip . --exclude '*/.DS_Store' --exclude '*/__MACOSX*'
          cd ../..
          echo "Archive size: $(du -sh frontend-deploy.zip | cut -f1)"

      # The university server's firewall drops connections from GitHub-hosted
      # runners (every run since 2026-08-20 died with curl exit 28 here, after
      # all build steps passed). Probe cPanel first: when it is unreachable,
      # skip the deploy steps with a loud warning instead of failing the run —
      # the build above has already validated the code. Ship from an allowed
      # network with `bash deploy-from-local.sh` until the firewall allowlists
      # GitHub's runner IP ranges (https://api.github.com/meta).
      - name: Preflight — is cPanel reachable from this runner?
        id: preflight
        # The block is intermittent, not absolute: a single probe kept
        # declaring the server unreachable on runs whose upload would have
        # worked. Probe up to 6 times over ~2 minutes and only give up if
        # every attempt fails.
        run: |
          reach=false
          for i in 1 2 3 4 5 6; do
            if curl -sk --connect-timeout 20 --max-time 30 -o /dev/null "$CPANEL_URL/login"; then
              reach=true; echo "cPanel reachable on attempt $i — deploying."; break
            fi
            echo "attempt $i: no answer from $CPANEL_URL"
            [ $i -lt 6 ] && sleep 20
          done
          echo "reachable=$reach" >> "$GITHUB_OUTPUT"
          if [ "$reach" != "true" ]; then
            echo "::warning title=Deploy skipped — cPanel unreachable::$CPANEL_URL did not answer in 6 attempts over 2 minutes (server firewall). The build passed; deploy from an allowed network: CPANEL_PASS='...' bash deploy-from-local.sh"
          fi
      - name: Upload & extract
        if: steps.preflight.outputs.reachable == 'true'
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        # NO PHP HELPER: the server's security layer blocks uploading .php
        # files (returns an HTML block page — run 33226* proved zips pass but
        # the extractor helper is flagged as a webshell, which is also what
        # keeps greylisting the runner IPs). Extraction happens server-side
        # through cPanel's own API instead: Fileman::fileop op=extract.
        # Uploads and extracts are retried and parse-safe.
        run: |
          up() {
            local f="$1" d="$2" r s i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -u "$CPANEL_USER:$CPANEL_PASS" \
                -F "dir=$d" -F "overwrite=1" -F "file-1=@$f" \
                "$CPANEL_URL/execute/Fileman/upload_files" || true)
              s=$(printf '%s' "$r" | jq -r '.status // 0' 2>/dev/null || echo 0)
              [ "$s" = "1" ] && { echo "upload $(basename "$f") -> $d: ok"; return 0; }
              echo "upload $(basename "$f") -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }
          ex() {
            local z="$1" d="$2" r i
            for i in 1 2 3; do
              r=$(curl -s -k --connect-timeout 20 --max-time 300 -u "$CPANEL_USER:$CPANEL_PASS" \
                "$CPANEL_URL/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=extract&sourcefiles=$z&destfiles=$d&doubledecode=0" || true)
              if printf '%s' "$r" | jq -e '(.cpanelresult.error // "") == "" and .cpanelresult.data' >/dev/null 2>&1; then
                echo "extract $z -> $d: ok"; return 0
              fi
              echo "extract $z -> $d attempt $i failed: ${r:0:300}"
              sleep 5
            done
            return 1
          }

          up frontend-deploy.zip /public_html/umis
          ex /public_html/umis/frontend-deploy.zip /public_html/umis
          echo "Frontend deployed."

      - name: Write job summary
        if: always()
        run: |
          echo "## Frontend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Upload | ${{ steps.preflight.outputs.reachable == 'true' && 'deployed' || 'SKIPPED — cPanel unreachable from GitHub runners; run deploy-from-local.sh' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`~/public_html/umis/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://cur.ac.rw/umis/ |" >> $GITHUB_STEP_SUMMARY
