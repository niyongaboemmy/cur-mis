name: Deploy — Frontend (React SPA)

# Target: /home/curac/public_html/umis/
# URL:    https://cur.ac.rw/umis/
# Method: cPanel UAPI (port 2083) for upload; PHP helper for extraction.
#         cPanel has no zip-extract API — .github/scripts/extract-inplace.php handles it.
#
# Required GitHub Secret:
#   CPANEL_PASS — cPanel account password

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  CPANEL_URL: https://cpanel.cur.ac.rw:2083
  CPANEL_USER: curac

jobs:
  build-and-deploy:
    name: Build & Deploy React SPA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npm run type-check
        working-directory: frontend

      # frontend/.env.production is committed to git and loaded by Vite automatically.
      - name: Build production bundle
        run: npm run build
        working-directory: frontend

      # Zip dist/ contents at archive root so they extract directly into the target dir.
      - name: Create deployment archive
        run: |
          cd frontend/dist
          zip -r ../../frontend-deploy.zip . --exclude '*/.DS_Store' --exclude '*/__MACOSX*'
          cd ../..
          echo "Archive size: $(du -sh frontend-deploy.zip | cut -f1)"

      - name: Upload & extract
        env:
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          TOKEN=$(openssl rand -hex 16)

          # Inject token + zip name into the PHP extractor template
          sed -e "s/DEPLOY_TOKEN/$TOKEN/" \
              -e "s/DEPLOY_ZIP_NAME/frontend-deploy.zip/" \
              .github/scripts/extract-inplace.php > _extract.php

          # Upload zip (overwrite=1 handles stale zips from failed previous runs)
          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis" \
            -F "overwrite=1" \
            -F "file-1=@frontend-deploy.zip;type=application/zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload zip: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Zip upload failed"; exit 1; }

          # Upload extractor script
          R=$(curl -s -k -u "$CPANEL_USER:$CPANEL_PASS" \
            -F "dir=/public_html/umis" \
            -F "overwrite=1" \
            -F "file-1=@_extract.php;type=text/plain" \
            "$CPANEL_URL/execute/Fileman/upload_files")
          echo "Upload extractor: $R"
          [ "$(echo "$R" | jq -r '.status // 0')" = "1" ] || { echo "Extractor upload failed"; exit 1; }

          # Trigger extraction — script self-destructs and deletes the zip
          RESULT=$(curl -s -k "https://cur.ac.rw/umis/_extract.php?token=$TOKEN")
          echo "Extract result: $RESULT"
          [ "$RESULT" = "ok" ] || { echo "Extraction failed: $RESULT"; exit 1; }

      - name: Write job summary
        if: always()
        run: |
          echo "## Frontend Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`~/public_html/umis/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://cur.ac.rw/umis/ |" >> $GITHUB_STEP_SUMMARY
